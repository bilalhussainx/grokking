<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>KairosLearn — UI kits</title>
<link rel="stylesheet" href="_shared.css"/>
<style>
  html, body { width:100%; height:100%; background:#0b0b0b; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" data-presets="react">
const { DesignCanvas, DCSection, DCArtboard } = window;
function App() {
  return (
    <DesignCanvas title="KairosLearn — UI kits" initialZoom={0.45}>
      <DCSection id="kits" title="Two surfaces, one brand" defaultCols={2}>
        <DCArtboard id="landing" label="Landing — Hero + Sequence + Features" width={1280} height={2800}>
          <window.Landing />
        </DCArtboard>
        <DCArtboard id="app" label="Product — College Counselor" width={1320} height={1100}>
          <window.ProductApp />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
