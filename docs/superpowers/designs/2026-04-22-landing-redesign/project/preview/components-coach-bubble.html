<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:220px;background:#0a0a0a">
  <div class="col gap-2">
    <!-- coach msg -->
    <div class="row gap-2" style="align-items:flex-start">
      <div style="width:28px;height:28px;border-radius:999px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.30);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#D4AF37;flex-shrink:0">K</div>
      <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;border-top-left-radius:4px;padding:10px 14px;max-width:440px;font-size:13px;color:rgba(255,255,255,.90);line-height:1.55">
        I'll read your draft as you write. Ask me about grammar, phrasing, or whether you're on track with the outline.
      </div>
    </div>
    <!-- user msg -->
    <div class="row gap-2" style="align-items:flex-start;justify-content:flex-end">
      <div style="background:rgba(212,175,55,.20);border:1px solid rgba(212,175,55,.30);border-radius:14px;border-top-right-radius:4px;padding:10px 14px;max-width:360px;font-size:13px;color:#f0ece2;line-height:1.55">
        Does my intro grab attention or does it read flat?
      </div>
      <div style="width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:rgba(255,255,255,.70);flex-shrink:0">You</div>
    </div>
    <!-- streaming -->
    <div class="row gap-2" style="align-items:flex-start;margin-top:2px">
      <div style="width:28px;height:28px;border-radius:999px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.30);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#D4AF37;flex-shrink:0;position:relative">
        K<span style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:999px;background:#34d399;animation:p 1s infinite"></span>
      </div>
      <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;border-top-left-radius:4px;padding:10px 14px;font-size:13px;color:rgba(255,255,255,.90)">
        Strong specifics. A couple thoughts
        <span style="display:inline-block;width:6px;height:12px;background:#D4AF37;animation:b 1s infinite;vertical-align:-2px"></span>
      </div>
    </div>
  </div>
  <style>@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}@keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
</div>
</body></html>
