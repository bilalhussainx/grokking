<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:180px">
  <div class="col gap-3">
    <div class="row gap-4" style="align-items:center">
      <div style="width:110px">
        <div class="mono" style="font-size:10px;color:rgba(255,255,255,.55)">Landing · GSAP</div>
        <div style="font-size:11px;color:rgba(255,255,255,.40);margin-top:2px">power3.out · 1.5s</div>
      </div>
      <div style="flex:1;height:32px;background:rgba(255,255,255,.04);border-radius:8px;position:relative;overflow:hidden">
        <div style="position:absolute;left:0;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(212,168,75,.50));border-radius:8px;animation:gsap 2.5s infinite cubic-bezier(0.22,1,0.36,1)"></div>
      </div>
    </div>
    <div class="row gap-4" style="align-items:center">
      <div style="width:110px">
        <div class="mono" style="font-size:10px;color:rgba(255,255,255,.55)">App · Framer</div>
        <div style="font-size:11px;color:rgba(255,255,255,.40);margin-top:2px">spring 25/300 · 0.5s</div>
      </div>
      <div style="flex:1;height:32px;background:rgba(255,255,255,.04);border-radius:8px;position:relative;overflow:hidden">
        <div style="position:absolute;left:0;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.60));border-radius:8px;animation:fram 1.4s infinite cubic-bezier(0.34,1.56,0.64,1)"></div>
      </div>
    </div>
    <div class="row gap-4" style="align-items:center">
      <div style="width:110px">
        <div class="mono" style="font-size:10px;color:rgba(255,255,255,.55)">Coach pulse</div>
        <div style="font-size:11px;color:rgba(255,255,255,.40);margin-top:2px">1s infinite</div>
      </div>
      <div style="flex:1;height:32px;display:flex;align-items:center">
        <span style="width:10px;height:10px;border-radius:999px;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pp 1s infinite"></span>
        <span style="margin-left:10px;font-size:12px;color:rgba(255,255,255,.70)">Kairos is thinking…</span>
      </div>
    </div>
  </div>
  <style>
    @keyframes gsap {0%{left:-40%}60%,100%{left:100%}}
    @keyframes fram {0%{left:-30%}70%,100%{left:100%}}
    @keyframes pp {0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.4}}
  </style>
</div>
</body></html>
