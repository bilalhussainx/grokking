<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:190px">
  <div class="row gap-3 flex-wrap" style="margin-bottom:10px">
    <button style="background:#D4AF37;color:#000;border:0;padding:10px 18px;font-family:Inter;font-weight:600;font-size:13px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Run full review</button>
    <button style="background:rgba(212,175,55,.10);color:#D4AF37;border:1px solid rgba(212,175,55,.30);padding:9px 16px;font-family:Inter;font-weight:500;font-size:13px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>New Essay</button>
    <button style="background:transparent;color:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.10);padding:9px 16px;font-family:Inter;font-weight:500;font-size:13px;border-radius:12px;cursor:pointer">Save draft</button>
    <button style="background:rgba(212,175,55,.10);color:#D4AF37;border:0;padding:8px 12px;font-family:Inter;font-weight:500;font-size:12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/></svg>Ask AI</button>
    <button style="background:transparent;color:rgba(255,255,255,.50);border:0;padding:6px 10px;font-family:Inter;font-weight:500;font-size:12px;cursor:pointer">Cancel</button>
  </div>
  <div class="mono" style="font-size:10px;color:rgba(255,255,255,.40);margin-top:6px">Primary · gold fill, black text · <span style="margin-left:4px">Secondary · gold-tint + 30% border</span> · <span style="margin-left:4px">Tertiary · outline</span> · <span style="margin-left:4px">Icon-led · AI gesture</span> · <span style="margin-left:4px">Ghost</span></div>
</div>
