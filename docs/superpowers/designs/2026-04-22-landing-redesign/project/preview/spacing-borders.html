<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="row gap-3" style="margin-bottom:12px">
    <div style="width:120px;height:56px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#141414;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.50)">white/08 default</div>
    <div style="width:120px;height:56px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:#141414;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.55)">white/10 row</div>
    <div style="width:120px;height:56px;border:1px solid rgba(212,175,55,.30);border-radius:12px;background:#141414;display:flex;align-items:center;justify-content:center;font-size:11px;color:#D4AF37">gold/30 hover</div>
    <div style="width:120px;height:56px;border:1px solid rgba(212,175,55,.40);border-radius:12px;background:#141414;display:flex;align-items:center;justify-content:center;font-size:11px;color:#D4AF37">gold/40 focus</div>
  </div>
  <div style="font-size:11px;color:rgba(255,255,255,.45);line-height:1.5">Hairline 1px only · never 2px · border <em>is</em> the separator (no shadows).</div>
</div>
</body></html>
