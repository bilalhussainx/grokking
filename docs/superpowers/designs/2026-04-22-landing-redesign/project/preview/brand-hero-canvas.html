<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:200px;padding:0;overflow:hidden;position:relative">
  <canvas id="c" width="700" height="200" style="display:block;width:100%;height:200px;background:#05080d"></canvas>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 0%, rgba(5,8,13,.75) 75%);pointer-events:none"></div>
  <div style="position:absolute;bottom:12px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-end">
    <div>
      <div style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:26px;line-height:1.05;color:#f2ede3;max-width:460px">The AI-Counselor Every Student <em style="color:#d4a84b;font-style:italic">Deserves.</em></div>
      <div class="mono" style="font-size:9.5px;color:rgba(242,237,227,.45);margin-top:6px">Neural canvas · 90 particles · gold edges · 0.25 opacity lines</div>
    </div>
  </div>
</div>
<script>
(()=>{const c=document.getElementById('c');const x=c.getContext('2d');const W=c.width,H=c.height;const N=60;const pts=Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2}));function tick(){x.clearRect(0,0,W,H);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}for(let i=0;i<N;i++){for(let j=i+1;j<N;j++){const a=pts[i],b=pts[j];const dx=a.x-b.x,dy=a.y-b.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<110){x.strokeStyle='rgba(212,168,75,'+(0.25*(1-d/110))+')';x.lineWidth=.5;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}for(const p of pts){x.fillStyle='rgba(212,168,75,0.7)';x.beginPath();x.arc(p.x,p.y,1.2,0,Math.PI*2);x.fill()}requestAnimationFrame(tick)}tick();})();
</script>
</body></html>
