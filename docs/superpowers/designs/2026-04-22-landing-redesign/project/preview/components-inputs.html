<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:220px">
  <div class="col gap-3">
    <div>
      <div style="font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:rgba(255,255,255,.60);font-weight:500;margin-bottom:6px">Prompt</div>
      <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:10px 12px;font-size:13px;color:#fff">Describe a topic you find so engaging it makes you lose all track of time.</div>
    </div>
    <div>
      <div style="font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:rgba(255,255,255,.60);font-weight:500;margin-bottom:6px">Ask Coach Kairos</div>
      <div style="background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.30);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px">
        <input placeholder="Ask a question about your essay..." style="background:transparent;border:0;color:#fff;font-size:13px;flex:1;outline:none;font-family:Inter"/>
        <button style="background:#D4AF37;border:0;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>
    <div class="row gap-2">
      <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:6px 10px;font-size:12px;color:rgba(255,255,255,.70);display:flex;align-items:center;gap:6px;flex:1;min-width:200px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.50)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span style="color:rgba(255,255,255,.40)">Search schools...</span>
      </div>
      <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;font-size:12px;color:#D4AF37;display:flex;align-items:center;gap:6px">
        🇺🇸 English <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:2px"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
  </div>
</div>
</body></html>
