<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:200px">
  <div class="col gap-3">
    <div>
      <div class="row justify-between" style="margin-bottom:6px">
        <span style="font-size:11px;color:rgba(255,255,255,.70)">Personal Statement</span>
        <span class="mono" style="font-size:11px;color:rgba(255,255,255,.50)">142 / 650</span>
      </div>
      <div style="height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden">
        <div style="height:100%;width:22%;background:#D4AF37;border-radius:999px"></div>
      </div>
    </div>
    <div>
      <div class="row justify-between" style="margin-bottom:6px">
        <span style="font-size:11px;color:rgba(255,255,255,.70)">Why This School — Yale</span>
        <span class="mono" style="font-size:11px;color:rgba(255,255,255,.50)">124 / 125</span>
      </div>
      <div style="height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden">
        <div style="height:100%;width:99%;background:#34d399;border-radius:999px"></div>
      </div>
    </div>
    <div style="border-top:1px solid rgba(255,255,255,.06);padding-top:14px">
      <!-- stepper -->
      <div class="row gap-2" style="align-items:center">
        
          <div style="width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#D4AF37;color:#000;border:1px solid transparent">✓</div>
          <span style="font-size:11px;color:#fff">Brainstorm</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,.08);margin:0 4px"></div>
        
          <div style="width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#D4AF37;color:#000;border:1px solid transparent">✓</div>
          <span style="font-size:11px;color:#fff">Outline</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,.08);margin:0 4px"></div>
        
          <div style="width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#D4AF37;color:#000;border:1px solid transparent">✓</div>
          <span style="font-size:11px;color:#fff">Draft</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,.08);margin:0 4px"></div>
        
          <div style="width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:rgba(255,255,255,.06);color:rgba(255,255,255,.40);border:1px solid rgba(255,255,255,.10)">4</div>
          <span style="font-size:11px;color:rgba(255,255,255,.40)">Revise</span>
          
        
      </div>
    </div>
  </div>
</div>
</body></html>
