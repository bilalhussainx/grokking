<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:190px">
  <div class="col gap-3">
    <div class="row gap-3" style="align-items:center">
      <div style="width:36px;height:20px;background:#D4AF37;border-radius:999px;position:relative;cursor:pointer"><span style="position:absolute;top:2px;right:2px;width:16px;height:16px;background:#000;border-radius:999px"></span></div>
      <div style="font-size:13px;color:#fff">Let Coach Kairos read my drafts as I write</div>
    </div>
    <div class="row gap-3" style="align-items:center">
      <div style="width:36px;height:20px;background:rgba(255,255,255,.10);border-radius:999px;position:relative;cursor:pointer"><span style="position:absolute;top:2px;left:2px;width:16px;height:16px;background:rgba(255,255,255,.70);border-radius:999px"></span></div>
      <div style="font-size:13px;color:rgba(255,255,255,.70)">Voice coach — speak in my first language</div>
    </div>
    <div class="row gap-2" style="align-items:center;margin-top:4px">
      <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:2px;display:flex;gap:2px">
        <div style="padding:5px 14px;font-size:12px;font-weight:500;color:#000;background:#D4AF37;border-radius:8px">Coach</div>
        <div style="padding:5px 14px;font-size:12px;color:rgba(255,255,255,.60)">Notes</div>
        <div style="padding:5px 14px;font-size:12px;color:rgba(255,255,255,.60)">History</div>
      </div>
      <div style="margin-left:8px;padding:4px 10px;font-size:10px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.40);background:rgba(255,255,255,.04);border-radius:6px;border:1px solid rgba(255,255,255,.08)">⌘ K</div>
    </div>
  </div>
</div>
</body></html>
