<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card card-landing" style="min-height:170px">
  <div class="row gap-3" style="margin-bottom:10px">
    <button style="background:#f2ede3;color:#05080d;border:0;padding:14px 28px;font-family:'DM Sans';font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0">Try it free</button>
    <button style="background:transparent;color:#f2ede3;border:1px solid rgba(242,237,227,.30);padding:13px 26px;font-family:'DM Sans';font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0">See the vision</button>
    <button style="background:transparent;color:#d4a84b;border:1px solid rgba(212,168,75,.40);padding:13px 26px;font-family:'DM Sans';font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:0">Begin &nbsp;→</button>
  </div>
  <div class="mono" style="font-size:9.5px;color:rgba(242,237,227,.40);margin-top:10px">
    Primary · cream fill, hover → gold · <span style="margin-left:6px">Outline · 1px cream/30</span> · <span style="margin-left:6px">Ghost gold</span> — all square, 0.12em tracking
  </div>
</div>
</body></html>
