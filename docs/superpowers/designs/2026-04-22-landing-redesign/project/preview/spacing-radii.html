<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card">
  <div class="row gap-3" style="margin-bottom:12px;align-items:flex-end">
    
      <div class="col gap-2" style="align-items:center">
        <div style="width:64px;height:48px;background:#141414;border:1px solid rgba(212,175,55,.30);border-radius:0px"></div>
        <span class="mono" style="font-size:9px;color:rgba(255,255,255,.55)">square</span>
        <span style="font-size:9px;color:rgba(255,255,255,.35)">landing</span>
      </div>
      <div class="col gap-2" style="align-items:center">
        <div style="width:64px;height:48px;background:#141414;border:1px solid rgba(212,175,55,.30);border-radius:6px"></div>
        <span class="mono" style="font-size:9px;color:rgba(255,255,255,.55)">rounded-md</span>
        <span style="font-size:9px;color:rgba(255,255,255,.35)">small chip</span>
      </div>
      <div class="col gap-2" style="align-items:center">
        <div style="width:64px;height:48px;background:#141414;border:1px solid rgba(212,175,55,.30);border-radius:8px"></div>
        <span class="mono" style="font-size:9px;color:rgba(255,255,255,.55)">rounded-lg</span>
        <span style="font-size:9px;color:rgba(255,255,255,.35)">pill / chip</span>
      </div>
      <div class="col gap-2" style="align-items:center">
        <div style="width:64px;height:48px;background:#141414;border:1px solid rgba(212,175,55,.30);border-radius:12px"></div>
        <span class="mono" style="font-size:9px;color:rgba(255,255,255,.55)">rounded-xl</span>
        <span style="font-size:9px;color:rgba(255,255,255,.35)">row / button</span>
      </div>
      <div class="col gap-2" style="align-items:center">
        <div style="width:64px;height:48px;background:#141414;border:1px solid rgba(212,175,55,.30);border-radius:16px"></div>
        <span class="mono" style="font-size:9px;color:rgba(255,255,255,.55)">rounded-2xl</span>
        <span style="font-size:9px;color:rgba(255,255,255,.35)">card</span>
      </div>
      <div class="col gap-2" style="align-items:center">
        <div style="width:64px;height:48px;background:#141414;border:1px solid rgba(212,175,55,.30);border-radius:999px"></div>
        <span class="mono" style="font-size:9px;color:rgba(255,255,255,.55)">rounded-full</span>
        <span style="font-size:9px;color:rgba(255,255,255,.35)">avatar</span>
      </div>
  </div>
  <div style="font-size:11px;color:rgba(255,255,255,.45);line-height:1.5">Landing squares everything · App rounds everything · no middle ground.</div>
</div>
</body></html>
