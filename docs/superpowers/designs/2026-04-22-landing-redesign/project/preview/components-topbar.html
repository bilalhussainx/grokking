<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="min-height:140px;padding:0">
  <div style="background:#0a0a0a;border-bottom:1px solid rgba(255,255,255,.08);padding:12px 20px;display:flex;align-items:center;gap:14px">
    <div class="row gap-2">
      <div style="width:28px;height:28px;border-radius:8px;background:#D4AF37;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:500;color:#000;font-size:14px;font-style:italic">K</div>
      <div style="font-size:14px;font-weight:600;color:#fff">KairosLearn</div>
    </div>
    <div style="width:1px;height:20px;background:rgba(255,255,255,.10);margin:0 4px"></div>
    <div style="font-size:12px;color:rgba(255,255,255,.50)">College Counselor</div>
    <div style="font-size:12px;color:rgba(255,255,255,.35)">/</div>
    <div style="font-size:12px;color:#fff;font-weight:500">Essay Studio</div>
    <div style="flex:1"></div>
    <div style="font-size:11px;color:rgba(255,255,255,.50);display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.04)">
      <span style="width:6px;height:6px;border-radius:999px;background:#34d399"></span>Draft autosaved
    </div>
    <button style="background:#D4AF37;color:#000;border:0;padding:6px 14px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer">Run full review</button>
    <div style="width:30px;height:30px;border-radius:999px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.30);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#D4AF37">M</div>
  </div>
  <div style="padding:10px 20px;font-size:11px;color:rgba(255,255,255,.40)">Topbar — same across all app pages. KairosLearn mark · section breadcrumb · autosave · primary CTA · profile.</div>
</div>
</body></html>
