name: counselor-e2e
on:
  pull_request:
    paths:
      - 'src/app/api/counselor/**'
      - 'src/app/counselor/**'
      - 'src/app/join/**'
      - 'src/lib/cc/**'
      - 'src/middleware.ts'
      - 'supabase/migrations/**'
      - 'tests/e2e/counselor/**'
      - 'tests/e2e/helpers/**'
      - 'playwright.config.ts'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:counselor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: counselor-e2e-traces
          path: tests/e2e/test-results
